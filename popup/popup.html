<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <title>FAdblock</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container" id="app">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="" aria-hidden="true" class="logo-img" />
        <span class="logo-text">FAdblock</span>
      </div>
      <label class="toggle" aria-label="Bütün bloklamanı aç/bağla">
        <input type="checkbox" id="globalToggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <div class="site-row" id="siteRow">
      <span id="siteDomain" class="domain">—</span>
      <label class="toggle toggle--sm" aria-label="Bu sayt üçün aç/bağla">
        <input type="checkbox" id="siteToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="tabCount">0</span>
        <span class="stat-label">Bu səhifədə</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="todayCount">0</span>
        <span class="stat-label">Bu gün</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Cəmi</span>
      </div>
    </div>

    <div class="pick-row">
      <button class="btn-pick" id="pickBtn">⊙ Element seç</button>
    </div>

    <footer class="footer">
      <button class="btn-link" id="openOptions">Parametrlər</button>
      <button class="btn-donate" id="donateBtn">♥ Dəstəklə</button>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
