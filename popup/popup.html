<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FAdblock</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container" id="app">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="" aria-hidden="true" class="logo-img" />
        <span class="logo-text">FAdblock</span>
      </div>
      <label class="toggle" data-i18n-aria-label="popupGlobalToggleLabel">
        <input type="checkbox" id="globalToggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <div class="pause-row" id="pauseRow">
      <span class="pause-icon">⏸</span>
      <div class="pause-btns" id="pauseBtns">
        <button class="btn-pause" data-min="10">10m</button>
        <button class="btn-pause" data-min="30">30m</button>
        <button class="btn-pause" data-min="60">1h</button>
      </div>
      <div class="pause-active" id="pauseActive" style="display:none">
        <span class="pause-countdown" id="pauseCountdown">--:--</span>
        <button class="btn-resume" id="resumeBtn">↺</button>
      </div>
    </div>

    <div class="site-row" id="siteRow">
      <span id="siteDomain" class="domain">—</span>
      <label class="toggle toggle--sm" data-i18n-aria-label="popupSiteToggleLabel">
        <input type="checkbox" id="siteToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="quick-grid">
      <button class="quick-btn" id="brokenSiteBtn">Broken site</button>
      <button class="quick-btn" id="undoBtn">Undo last</button>
      <button class="quick-btn" id="sitePause60Btn">Pause site 1h</button>
    </div>
    <div class="quick-meta" id="siteRecoveryMeta" style="display:none"></div>

    <section class="site-controls" id="siteControls">
      <div class="section-title">This site</div>
      <label class="mini-toggle-row">
        <span>Cosmetic filter</span>
        <input type="checkbox" id="siteCosmeticToggle" checked />
      </label>
      <label class="mini-toggle-row">
        <span>Custom CSS</span>
        <input type="checkbox" id="siteCustomSelectorsToggle" checked />
      </label>
      <label class="mini-toggle-row">
        <span>Social filter</span>
        <input type="checkbox" id="siteSocialToggle" checked />
      </label>
    </section>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="tabCount">0</span>
        <span class="stat-label" data-i18n="popupStatTab">Bu səhifədə</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="todayCount">0</span>
        <span class="stat-label" data-i18n="popupStatToday">Bu gün</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label" data-i18n="popupStatTotal">Cəmi</span>
      </div>
    </div>

    <div class="pick-row">
      <button class="btn-pick" id="pickBtn" data-i18n="popupPickButton">⊙ Element seç</button>
    </div>

    <footer class="footer">
      <button class="btn-link" id="openOptions" data-i18n="popupOpenOptions">Parametrlər</button>
      <button class="btn-donate" id="donateBtn" data-i18n="popupDonate">♥ Dəstəklə</button>
    </footer>

    <div style="padding:6px 12px 10px">
      <button id="exportLogsBtn" style="width:100%;padding:6px;font-size:11px;cursor:pointer;border:1px solid #ccc;border-radius:4px;background:#f5f5f5">⬇ Export Debug Logs</button>
    </div>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
