<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FAdblock</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container" id="app">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="" aria-hidden="true" class="logo-img" />
        <span class="logo-text">FAdblock</span>
      </div>
      <label class="toggle" data-i18n-aria-label="popupGlobalToggleLabel">
        <input type="checkbox" id="globalToggle" checked />
        <span class="slider"></span>
      </label>
    </header>

    <!-- Global pause -->
    <div class="pause-row" id="pauseRow">
      <span class="pause-icon">⏸</span>
      <div class="pause-btns" id="pauseBtns">
        <button class="btn-pause" data-min="15" data-i18n="popup15m">15m</button>
        <button class="btn-pause" data-min="30" data-i18n="popup30m">30m</button>
        <button class="btn-pause" data-min="60" data-i18n="popup1h">1s</button>
      </div>
      <div class="pause-active" id="pauseActive" style="display:none">
        <span class="pause-countdown" id="pauseCountdown">--:--</span>
        <button class="btn-resume" id="resumeBtn" data-i18n="popupResume">↺</button>
      </div>
    </div>

    <div class="site-row" id="siteRow">
      <span id="siteDomain" class="domain">—</span>
      <label class="toggle toggle--sm" data-i18n-aria-label="popupSiteToggleLabel">
        <input type="checkbox" id="siteToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <!-- Per-site pause -->
    <div class="site-pause-row" id="sitePauseRow" style="display:none">
      <span class="site-pause-label" data-i18n="popupSitePause">Sayt pauza:</span>
      <button class="btn-pause btn-pause--sm" data-site-min="15">15m</button>
      <button class="btn-pause btn-pause--sm" data-site-min="30">30m</button>
      <button class="btn-pause btn-pause--sm" data-site-min="60">1s</button>
      <span class="site-pause-countdown" id="sitePauseCountdown" style="display:none"></span>
      <button class="btn-resume btn-resume--sm" id="siteResumeBtn" style="display:none" data-i18n="popupResume">↺</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="tabCount">0</span>
        <span class="stat-label" data-i18n="popupStatTab">Bu səhifədə</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="todayCount">0</span>
        <span class="stat-label" data-i18n="popupStatToday">Bu gün</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label" data-i18n="popupStatTotal">Cəmi</span>
      </div>
    </div>

    <div class="pick-row">
      <button class="btn-pick" id="pickBtn" data-i18n="popupPickButton">⊙ Element seç</button>
    </div>

    <footer class="footer">
      <button class="btn-link" id="openOptions" data-i18n="popupOpenOptions">Parametrlər</button>
      <button class="btn-donate" id="donateBtn" data-i18n="popupDonate">♥ Dəstəklə</button>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
