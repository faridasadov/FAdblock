<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdBlock Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon32.png" alt="" class="logo-img" aria-hidden="true" />
        <span class="logo-text">AdBlock Pro</span>
      </div>
      <label class="toggle" aria-label="Bu sayt üçün bloklamanı aç/bağla">
        <input type="checkbox" id="siteToggle" checked />
        <span class="slider" aria-hidden="true"></span>
      </label>
    </header>

    <div class="site-info">
      <span id="siteDomain" class="domain">—</span>
      <span id="siteStatus" class="badge badge--on">Aktiv</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-number" id="tabCount">0</span>
        <span class="stat-label">Bu səhifədə</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="todayCount">0</span>
        <span class="stat-label">Bu gün</span>
      </div>
      <div class="stat-card">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Cəmi</span>
      </div>
    </div>

    <footer class="footer">
      <button class="btn-link" id="openOptions">Parametrlər</button>
      <button class="btn-link" id="resetStats">Sıfırla</button>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
